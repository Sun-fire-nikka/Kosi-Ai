feature_registry:
  - feature_name: "segment_id"
    category: "identification"
    source: "derived"
    observed_or_derived: "derived"
    units: "string"
    spatial_resolution: "segment-level"
    temporal_resolution: "static"
    required: true
    missing_policy: "error"
    valid_range: "N/A"
    reliability: "high"
    notes: "Unique identifier for each river segment"

  - feature_name: "latitude"
    category: "identification"
    source: "derived"
    observed_or_derived: "derived"
    units: "decimal degrees"
    spatial_resolution: "segment-level"
    temporal_resolution: "static"
    required: true
    missing_policy: "error"
    valid_range: "-90 to 90"
    reliability: "high"
    notes: "WGS84 coordinate"

  - feature_name: "longitude"
    category: "identification"
    source: "derived"
    observed_or_derived: "derived"
    units: "decimal degrees"
    spatial_resolution: "segment-level"
    temporal_resolution: "static"
    required: true
    missing_policy: "error"
    valid_range: "-180 to 180"
    reliability: "high"
    notes: "WGS84 coordinate"

  - feature_name: "chainage"
    category: "identification"
    source: "derived"
    observed_or_derived: "derived"
    units: "km"
    spatial_resolution: "segment-level"
    temporal_resolution: "static"
    required: false
    missing_policy: "fill_from_upstream"
    valid_range: "0 to segment_length"
    reliability: "medium"
    notes: "Distance along embankment from reference point"

  - feature_name: "river_level"
    category: "hydrological"
    source: "identified"
    observed_or_derived: "observed"
    units: "m"
    spatial_resolution: "segment-level"
    temporal_resolution: "daily"
    required: true
    missing_policy: "interpolate_nearest"
    valid_range: ">= 0"
    reliability: "high"
    notes: "Water level from Bihar WMBS or FMISC bulletin"

  - feature_name: "discharge"
    category: "hydrological"
    source: "identified"
    observed_or_derived: "observed"
    units: "m^3/s"
    spatial_resolution: "segment-level"
    temporal_resolution: "daily"
    required: false
    missing_policy: "use_downstream_value"
    valid_range: ">= 0"
    reliability: "medium"
    notes: "From CWC or FMISC; may be estimated"

  - feature_name: "water_level_change"
    category: "hydrological"
    source: "derived"
    observed_or_derived: "derived"
    units: "m/day"
    spatial_resolution: "segment-level"
    temporal_resolution: "daily"
    required: true
    missing_policy: "calculate_from_successive"
    valid_range: "any"
    reliability: "medium"
    notes: "Rate of change in river level; key stress indicator"

  - feature_name: "discharge_change"
    category: "hydrological"
    source: "derived"
    observed_or_derived: "derived"
    units: "m^3/s/day"
    spatial_resolution: "segment-level"
    temporal_resolution: "daily"
    required: false
    missing_policy: "calculate_from_successive"
    valid_range: "any"
    reliability: "medium"
    notes: "Rate of change in discharge"

  - feature_name: "rainfall_24h"
    category: "rainfall"
    source: "identified"
    observed_or_derived: "observed"
    units: "mm"
    spatial_resolution: "district-level"
    temporal_resolution: "daily"
    required: false
    missing_policy: "use_nearest_station"
    valid_range: ">= 0"
    reliability: "high"
    notes: "IMD daily rainfall at nearest station"

  - feature_name: "rainfall_72h"
    category: "rainfall"
    source: "identified"
    observed_or_derived: "observed"
    units: "mm"
    spatial_resolution: "district-level"
    temporal_resolution: "daily"
    required: false
    missing_policy: "use_nearest_station"
    valid_range: ">= 0"
    reliability: "high"
    notes: "Cumulative IMD rainfall over 72 hours"

  - feature_name: "rainfall_7d"
    category: "rainfall"
    source: "identified"
    observed_or_derived: "observed"
    units: "mm"
    spatial_resolution: "district-level"
    temporal_resolution: "daily"
    required: false
    missing_policy: "use_nearest_station"
    valid_range: ">= 0"
    reliability: "high"
    notes: "Cumulative IMD rainfall over 7 days"

  - feature_name: "embankment_height"
    category: "embankment"
    source: "identified"
    observed_or_derived: "observed"
    units: "m"
    spatial_resolution: "segment-level"
    temporal_resolution: "irregular"
    required: true
    missing_policy: "flag_for_review"
    valid_range: ">= 0"
    reliability: "medium"
    notes: "Height of embankment crest above datum"

  - feature_name: "crest_elevation"
    category: "embankment"
    source: "identified"
    observed_or_derived: "observed"
    units: "m"
    spatial_resolution: "segment-level"
    temporal_resolution: "irregular"
    required: true
    missing_policy: "flag_for_review"
    valid_range: ">= 0"
    reliability: "medium"
    notes: "Elevation of crest relative to datum"

  - feature_name: "freeboard"
    category: "embankment"
    source: "derived"
    observed_or_derived: "derived"
    units: "m"
    spatial_resolution: "segment-level"
    temporal_resolution: "daily"
    required: true
    missing_policy: "calculate_from_river_level_and_embankment_height"
    valid_range: ">= 0"
    reliability: "high"
    notes: "embankment_height - river_level; primary overtopping risk indicator"

  - feature_name: "slope"
    category: "embankment"
    source: "identified"
    observed_or_derived: "observed"
    units: "ratio (m/m)"
    spatial_resolution: "segment-level"
    temporal_resolution: "irregular"
    required: false
    missing_policy: "flag_for_review"
    valid_range: ">= 0"
    reliability: "medium"
    notes: "Side-slope gradient of embankment cross-section"

  - feature_name: "material"
    category: "embankment"
    source: "identified"
    observed_or_derived: "observed"
    units: "categorical"
    spatial_resolution: "segment-level"
    temporal_resolution: "static"
    required: false
    missing_policy: "categorize_as_unknown"
    valid_range: "N/A"
    reliability: "medium"
    notes: "Typical values: earthen, concrete, stone-faced"

  - feature_name: "condition"
    category: "embankment"
    source: "identified"
    observed_or_derived: "observed"
    units: "categorical"
    spatial_resolution: "segment-level"
    temporal_resolution: "irregular"
    required: true
    missing_policy: "assess_from_visuals"
    valid_range: "N/A"
    reliability: "medium"
    notes: "Typical: good, fair, poor; based on visual inspection"

  - feature_name: "elevation"
    category: "geospatial"
    source: "identified"
    observed_or_derived: "observed"
    units: "m"
    spatial_resolution: "30m (SRTM)"
    temporal_resolution: "static"
    required: true
    missing_policy: "use_DEM_interpolation"
    valid_range: ">= 0"
    reliability: "medium"
    notes: "Ground elevation from SRTM or local surveys"

  - feature_name: "local_slope"
    category: "geospatial"
    source: "derived"
    observed_or_derived: "derived"
    units: "ratio (m/m)"
    spatial_resolution: "segment-level"
    temporal_resolution: "static"
    required: false
    missing_policy: "compute_from_DEM"
    valid_range: ">= 0"
    reliability: "medium"
    notes: "Local terrain slope within segment"

  - feature_name: "river_width"
    category: "geospatial"
    source: "identified"
    observed_or_derived: "observed"
    units: "m"
    spatial_resolution: "segment-level"
    temporal_resolution: "irregular"
    required: false
    missing_policy: "use_historical_average"
    valid_range: ">= 0"
    reliability: "medium"
    notes: "Width of river channel at segment"

  - feature_name: "river_curvature"
    category: "geospatial"
    source: "derived"
    observed_or_derived: "derived"
    units: "1/km"
    spatial_resolution: "segment-level"
    temporal_resolution: "static"
    required: false
    missing_policy: "compute_from_centerline"
    valid_range: ">= 0"
    reliability: "low"
    notes: "Curvature of river centerline; high curvature may increase stress"

  - feature_name: "distance_to_river"
    category: "geospatial"
    source: "derived"
    observed_or_derived: "derived"
    units: "m"
    spatial_resolution: "segment-level"
    temporal_resolution: "static"
    required: false
    missing_policy: "compute_from_coordinates"
    valid_range: ">= 0"
    reliability: "medium"
    notes: "Horizontal distance from segment point to river centerline"

  - feature_name: "floodplain_characteristics"
    category: "geospatial"
    source: "identified"
    observed_or_derived: "observed"
    units: "categorical"
    spatial_resolution: "segment-level"
    temporal_resolution: "static"
    required: false
    missing_policy: "classify_from_terrain"
    valid_range: "N/A"
    reliability: "low"
    notes: "Width, land use, connectivity to floodplain"

  - feature_name: "soil_type"
    category: "soil"
    source: "identified"
    observed_or_derived: "observed"
    units: "categorical"
    spatial_resolution: "segment-level"
    temporal_resolution: "static"
    required: false
    missing_policy: "assign_default"
    valid_range: "N/A"
    reliability: "low"
    notes: "Typical: clay, silt, sand, loam"

  - feature_name: "soil_moisture"
    category: "soil"
    source: "identified"
    observed_or_derived: "observed"
    units: "volumetric water content"
    spatial_resolution: "segment-level"
    temporal_resolution: "daily"
    required: false
    missing_policy: "use_default_or_nearest"
    valid_range: "0 to 1"
    reliability: "medium"
    notes: "If available from SMAP or local sensors"

  - feature_name: "erosion_indicator"
    category: "erosion_sediment"
    source: "identified"
    observed_or_derived: "observed"
    units: "categorical"
    spatial_resolution: "segment-level"
    temporal_resolution: "irregular"
    required: false
    missing_policy: "assign_zero"
    valid_range: "N/A"
    reliability: "medium"
    notes: "Active erosion observed: yes/no/uncertain"

  - feature_name: "sedimentation_indicator"
    category: "erosion_sediment"
    source: "identified"
    observed_or_derived: "observed"
    units: "categorical"
    spatial_resolution: "segment-level"
    temporal_resolution: "irregular"
    required: false
    missing_policy: "assign_zero"
    valid_range: "N/A"
    reliability: "medium"
    notes: "Accretion/sedimentation observed: yes/no/uncertain"

  - feature_name: "historical_failure_count"
    category: "historical"
    source: "identified"
    observed_or_derived: "observed"
    units: "count"
    spatial_resolution: "segment-level"
    temporal_resolution: "cumulative"
    required: false
    missing_policy: "zero_if_unknown"
    valid_range: "0 to infinity"
    reliability: "medium"
    notes: "Number of documented breach/failure events at segment"

  - feature_name: "historical_breach_distance"
    category: "historical"
    source: "identified"
    observed_or_derived: "observed"
    units: "km"
    spatial_resolution: "segment-level"
    temporal_resolution: "cumulative"
    required: false
    missing_policy: "zero_if_unknown"
    valid_range: ">= 0"
    reliability: "medium"
    notes: "Distance to nearest historical breach upstream/downstream"

  - feature_name: "historical_flood_frequency"
    category: "historical"
    source: "identified"
    observed_or_derived: "observed"
    units: "events/year"
    spatial_resolution: "segment-level"
    temporal_resolution: "cumulative"
    required: false
    missing_policy: "zero_if_unknown"
    valid_range: ">= 0"
    reliability: "medium"
    notes: "Historical flood occurrence frequency"