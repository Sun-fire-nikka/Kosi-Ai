data_sources:
  - source_name: "Bihar Water Resources Department FMISC"
    organization: "Government of Bihar"
    url: "https://www.fmiscwrdbihar.gov.in/bulletin/"
    dataset_name: "Kosi Embankment Bulletin"
    variable: "river_level, discharge, water_level"
    status: "IDENTIFIED"
    temporal_resolution: "daily"
    spatial_resolution: "segment-level"
    license_or_access_notes: "Department bulletin, public access"
    verification_status: "NOT_YET_INGESTED"

  - source_name: "India-WRIS"
    organization: "Central Water Commission"
    url: "https://india-wris.gov.in/"
    dataset_name: "Kosi Basin Flood and Sediment Management Master Plan"
    variable: "embankment_height, crest_elevation, freeboard"
    status: "IDENTIFIED"
    temporal_resolution: "annual"
    spatial_resolution: "segment-level"
    license_or_access_notes: "CWC data portal, access may require registration"
    verification_status: "NOT_YET_INGESTED"

  - source_name: "NRSC/Bhuvan"
    organization: "Indian Space Research Organisation"
    url: "https://bhuvan.nrsc.gov.in/"
    dataset_name: "Satellite imagery and flood maps"
    variable: "elevation, river_width, floodplain_characteristics"
    status: "IDENTIFIED"
    temporal_resolution: "varies (satellite pass)"
    spatial_resolution: "30m - 10m"
    license_or_access_notes: "ISRO data policy"
    verification_status: "NOT_YET_INGESTED"

  - source_name: "IMD"
    organization: "India Meteorological Department"
    url: "https://www.imd.gov.in/"
    dataset_name: "Rainfall data"
    variable: "rainfall_24h, rainfall_72h, rainfall_7d"
    status: "IDENTIFIED"
    temporal_resolution: "daily"
    spatial_resolution: "district-level"
    license_or_access_notes: "Indian Government data, public domain"
    verification_status: "NOT_YET_INGESTED"

  - source_name: "Kosi Embankment Asset Management System"
    organization: "Government of Bihar"
    url: "TBD"
    dataset_name: "Embankment condition, material, slope"
    variable: "embankment_condition, material, slope, erosion_indicator"
    status: "IDENTIFIED"
    temporal_respection: "irregular"
    spatial_resolution: "segment-level"
    license_or_access_notes: "Department records"
    verification_status: "NOT_YET_INGESTED"